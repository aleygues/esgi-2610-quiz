info:
  name: ST Cannot create quiz without auth
  type: http
  seq: 5

http:
  method: POST
  url: "{{api}}/quizzes"
  body:
    type: json
    data: |-
      {
        "title": "My first quiz"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP status is 403", () => {
          expect(res.status).to.eq(403);
        })

        test("error message is access denied", () => {
          const json = res.body;
          expect(json.message).to.eq("access denied");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
