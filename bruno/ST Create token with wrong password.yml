info:
  name: ST Create token with wrong password
  type: http
  seq: 2

http:
  method: POST
  url: "{{api}}/users/tokens"
  body:
    type: json
    data: |-
      {
        "email": "{{user1email}}",
        "password": "ABCDabcd!3"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP status is 400", () => {
          expect(res.status).to.eq(400);
        })

        test("error message is invalid credentials", () => {
          const json = res.body;
          expect(json.message).to.eq("invalid credentials");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
